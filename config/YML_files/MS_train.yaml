- model_inputs:
    model_type: 'ViT_VaR'
    num_classes: 2
    image_size: 224
    num_frames: 15
    channels: 3
    weighted: false
    num_test: 10
    ViT_VaR:
      model_type: vit_base_patch16_224
      pretrained: false
      patch_size: 16
      embedd_dim: 768
      interpolation_type: 'linear'

- dataset:
    dataset_name: 'MS'
    annotation_path_train: '/content/MS_Processed/train.csv'
    annotation_path_test: '/content/MS_Processed/test.csv'
    annotation_path_val: '/content/MS_Processed/val.csv'
    shuffle: true
    num_workers: 0
    loader_type: 'random_middle'

- train_config:
    train: true    # <--- THE MAGIC SWITCH
    pretrain: true
    resume: false
    allow_size_mismatch: false
    load_path: '/content/drive/MyDrive/'
    checkpoint: 'Duke_VLFAT_Weights_Fixed.pth'
    num_epochs: 200  
    batch_size: 2
    use_gpu: true
    init_lr: 0.001
    max_lr: 0.001
    min_lr: 0.00001
    warmup_lr: 0.001
    warmup_steps: -1
    warmup_epochs: 10
    T_mult: 1
    eta_min: 0
    last_epoch: -1
    update_freq: 1
    base_lr_cyclic: 3.0e-15
    optimizer: 'adam'
    scheduler: 'cosine_with_warmup'
    step_coeff: 25
    momentum: 0.9
    weight_decay: 0.02
    weight_decay_end: 'none'
    mixups_alpha: 0.0
    rand_aug: true
    rand_test: false

- log:
    save_path: 'logs'

- where: ''
